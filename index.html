<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skiptrace Search</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="mb-4">Skiptrace Search by Name</h3>

            <div class="mb-3">
                <label class="form-label">Enter Name</label>
                <input type="text" id="nameInput" class="form-control" placeholder="e.g., James E Whitsitt">
            </div>

            <button class="btn btn-primary" onclick="runSearch()">Search</button>

            <pre id="responseBox" class="mt-4 bg-dark text-white p-3 rounded" style="min-height: 200px;">
Response will appear here...
            </pre>
        </div>
    </div>
</div>

<script>
async function runSearch() {
    const name = document.getElementById("nameInput").value.trim();
    if (!name) return alert("Please enter a name");

    const encodedName = encodeURIComponent(name);
    const url = `/api/search?name=${encodedName}`;

    document.getElementById("responseBox").innerText = "Loading...";

    try {
        const res = await fetch(url);
        const data = await res.json();
        document.getElementById("responseBox").innerText = JSON.stringify(data, null, 2);
    } catch (err) {
        document.getElementById("responseBox").innerText = "Error: " + err;
    }
}
</script>

</body>
</html>
