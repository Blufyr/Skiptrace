<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skiptrace Search</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="mb-4">Skiptrace Search by Name</h3>

            <div class="mb-3">
                <label class="form-label">Enter Name</label>
                <input type="text" id="nameInput" class="form-control" placeholder="e.g., James E Whitsitt">
            </div>

            <button class="btn btn-primary" onclick="runSearch()">Search</button>

            <pre id="responseBox" class="mt-4 bg-dark text-white p-3 rounded" style="min-height: 200px;">
Response will appear here...
            </pre>
        </div>
    </div>
</div>

<!-- Upload Section -->
<div class="container mt-5">
    <button class="btn btn-secondary mb-3" 
            data-bs-toggle="collapse" 
            data-bs-target="#uploadSection">
        Toggle Database Upload
    </button>

    <div id="uploadSection" class="collapse">

        <div class="card p-4 shadow">
            <h4>Add Single Entry</h4>

            <form id="singleEntryForm" class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Case Number</label>
                    <input type="text" class="form-control" name="case_number">
                </div>

                <div class="col-md-6">
                    <label class="form-label">County</label>
                    <input type="text" class="form-control" name="county">
                </div>

                <div class="col-md-6">
                    <label class="form-label">State</label>
                    <input type="text" class="form-control" name="state">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Property Address</label>
                    <input type="text" class="form-control" name="property_address">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Parcel ID</label>
                    <input type="text" class="form-control" name="parcel_id">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Surplus Amount</label>
                    <input type="number" class="form-control" name="surplus_amount">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Sale Date</label>
                    <input type="date" class="form-control" name="sale_date">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Claimant Name</label>
                    <input type="text" class="form-control" name="claimant_name">
                </div>

                <div class="col-md-12">
                    <label class="form-label">Notes</label>
                    <textarea class="form-control" name="notes"></textarea>
                </div>

                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Submit Entry</button>
                </div>
            </form>

            <hr class="my-4">

            <h4>Upload CSV File</h4>
            <input type="file" id="csvUpload" accept=".csv" class="form-control mb-3">
            <button class="btn btn-success" onclick="uploadCSV()">Upload CSV</button>

            <pre id="uploadResponse" class="mt-4 bg-dark text-white p-3 rounded"></pre>
        </div>
    </div>
</div>

<script>
document.getElementById("singleEntryForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = Object.fromEntries(new FormData(e.target).entries());

    const res = await fetch("/api/upload-entry", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData)
    });

    const data = await res.json();
    document.getElementById("uploadResponse").innerText = JSON.stringify(data, null, 2);
});

async function uploadCSV() {
    const file = document.getElementById("csvUpload").files[0];
    if (!file) return alert("Please select a CSV file");

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/api/upload-csv", {
        method: "POST",
        body: formData
    });

    const data = await res.json();
    document.getElementById("uploadResponse").innerText = JSON.stringify(data, null, 2);
}
</script>

<script>
async function runSearch() {
    const name = document.getElementById("nameInput").value.trim();
    if (!name) return alert("Please enter a name");

    const encodedName = encodeURIComponent(name);
    const url = `/api/search?name=${encodedName}`;

    document.getElementById("responseBox").innerText = "Loading...";

    try {
        const res = await fetch(url);
        const data = await res.json();
        document.getElementById("responseBox").innerText = JSON.stringify(data, null, 2);
    } catch (err) {
        document.getElementById("responseBox").innerText = "Error: " + err;
    }
}
</script>

</body>
</html>
