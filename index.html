<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skiptrace + Dashboard System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">

<div class="container mt-4">
    <div class="row g-4">

        <!-- LEFT COLUMN: SKIP TRACE SEARCH -->
        <div class="col-md-6">
            <div class="card shadow p-4 h-100">
                <h3>Skiptrace Search</h3>

                <label class="form-label mt-2">Enter Name</label>
                <input type="text" id="nameInput" class="form-control" placeholder="e.g., James E Whitsitt">

                <button class="btn btn-primary mt-3" onclick="runSearch()">Search</button>

                <pre id="responseBox" class="mt-4 bg-dark text-white p-3 rounded" style="min-height: 200px;">
Response will appear here...
                </pre>
            </div>
        </div>

        <!-- RIGHT COLUMN: LOGIN BOX -->
        <div class="card shadow p-4 h-100 mt-4">
    <h3>Create User Account</h3>

    <input id="signupEmail" class="form-control mt-3" placeholder="Email">
    <input id="signupPassword" type="password" class="form-control mt-3" placeholder="Password">

    <label class="form-label mt-3">Select Role</label>
    <select id="signupRole" class="form-control">
        <option value="viewer">Viewer</option>
        <option value="staff">Staff</option>
        <option value="admin">Admin</option>
    </select>

    <button class="btn btn-primary w-100 mt-3" onclick="signup()">Create Account</button>

    <pre id="signupStatus" class="mt-3"></pre>
</div>


<!-- UPLOAD SECTION (Hidden until login) -->
<div id="uploadSection" style="display:none;">
    <div class="container mt-5">
        <div class="card p-4 shadow">
            <h3>Upload Records</h3>

            <h4 class="mt-4">Add Single Entry</h4>
            <form id="singleEntryForm" class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Case Number</label>
                    <input type="text" class="form-control" name="case_number">
                </div>

                <div class="col-md-6">
                    <label class="form-label">County</label>
                    <script>
async function signup() {
    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;
    const role = document.getElementById("signupRole").value;

    const res = await fetch("/auth/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password, role })
    });

    const data = await res.json();
    document.getElementById("signupStatus").innerText = JSON.stringify(data, null, 2);
}
</script>
